name: Feature Request
description: Suggest a new feature or a change
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: What problem would this solve?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: What do you propose?
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives you considered
      validations:
          required: false
